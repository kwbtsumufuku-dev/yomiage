<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="重要事項説明読み上げ" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0f766e" />
<title>重要事項説明 読み上げアプリ</title>

<script src="https://cdn.tailwindcss.com"></script>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1&external=react",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "mammoth": "https://esm.sh/mammoth@1.8.0"
  }
}
</script>

<style>
  html, body, #root { height: 100%; }
  body { margin: 0; background: #fafaf9; -webkit-tap-highlight-color: transparent; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#78716c;font-family:sans-serif;font-size:14px;">
      読み込み中...
    </div>
  </div>

  <script>
    (function() {
      function showFatalError(msg) {
        var el = document.getElementById('root');
        if (!el) return;
        el.innerHTML =
          '<div style="padding:20px;font-family:sans-serif;font-size:13px;color:#7f1d1d;background:#fef2f2;white-space:pre-wrap;word-break:break-word;">' +
          '起動時にエラーが発生しました。この画面をスクリーンショットで送ってください。\n\n' +
          String(msg).replace(/</g, '&lt;') +
          '</div>';
      }
      window.addEventListener('error', function(e) {
        showFatalError((e.error && (e.error.stack || e.error.message)) || e.message || e);
      });
      window.addEventListener('unhandledrejection', function(e) {
        showFatalError((e.reason && (e.reason.stack || e.reason.message)) || e.reason);
      });
      setTimeout(function() {
        var el = document.getElementById('root');
        if (el && el.textContent.indexOf('読み込み中') !== -1) {
          showFatalError('15秒待っても画面が表示されませんでした。通信環境をご確認の上、この画面をスクリーンショットで送ってください。');
        }
      }, 15000);
    })();
  </script>

  <script type="module" src="./app.js"></script>
</body>
</html>
